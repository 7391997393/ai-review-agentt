name: Reusable AI Code Review
 
on:
  workflow_call:
    inputs:
      cg_model:
        required: true
        type: string
      cg_base_url:
        required: true
        type: string
    secrets:
      cg_api_key:
        required: true
      gh_pat:
        required: true
 
jobs:
  ai-review:
    runs-on: ubuntu-latest
 
    permissions:
      contents: read
      pull-requests: write
 
    steps:
      - name: Checkout AI Review Agent
        uses: actions/checkout@v4
        with:
          repository: 7391997393/ai-review-agentt
          ref: feature/resolve-review-threads
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Validate GitHub token format
        env:
          GITHUB_TOKEN: ${{ secrets.gh_pat }}
        run: |
          python -c "import os; t=os.environ.get('GITHUB_TOKEN', ''); print('Token present:', bool(t)); print('Token length:', len(t)); print('Contains newline:', chr(10) in t or chr(13) in t)"
 
      - name: Run AI Code Review
        env:
          CG_API_KEY: ${{ secrets.cg_api_key }}
          CG_MODEL: ${{ inputs.cg_model }}
          CG_BASE_URL: ${{ inputs.cg_base_url }}
          GITHUB_TOKEN: ${{ secrets.gh_pat }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python main.py