[project]
name = "ai-review-agent"
version = "0.2.0"
description = "Reusable AI Pull Request code-review agent (GitHub MCP + LangGraph + Capgemini Generative Engine)"
readme = "README.md"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (checked by tests/test_project_config.py).
dependencies = [
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "mcp>=1.27,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Keep in sync with requirements-dev.txt.
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.15,<1",
]

# This is an application, not an installable library: install it with
# `pip install -r requirements.txt` (or requirements-dev.txt) and run main.py.
# Declaring no packages stops `pip install .` from building a wheel that would
# put generic top-level modules such as `config` into site-packages.
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE"]

[tool.ruff.lint.isort]
known-first-party = ["src", "main", "tests"]
