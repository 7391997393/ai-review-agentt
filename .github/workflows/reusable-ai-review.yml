name: Reusable AI Code Review

on:
  workflow_call:
    inputs:
      cg_model:
        description: Capgemini Generative Engine model name.
        required: true
        type: string
      cg_base_url:
        description: OpenAI-compatible base URL (empty = Capgemini default).
        required: false
        type: string
        default: ""
      agent_ref:
        description: >-
          Branch, tag or SHA of the agent code to run. Keep it equal to the ref used in
          `uses: ...reusable-ai-review.yml@<ref>` so the workflow and the code match.
        required: false
        type: string
        default: main
      agent_repository:
        description: Repository that contains the agent code.
        required: false
        type: string
        default: 7391997393/ai-review-agentt
      reopen_resolved_threads:
        description: Reopen resolved AI threads whose finding is reported again.
        required: false
        type: boolean
        default: false
      agent_logins:
        description: >-
          Comma-separated extra accounts that posted AI comments for this agent before
          (e.g. github-actions[bot]); their AI-format threads count as the agent's own.
        required: false
        type: string
        default: ""
      log_level:
        required: false
        type: string
        default: INFO
    secrets:
      cg_api_key:
        required: true
      gh_pat:
        required: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # One review at a time per PR. A newer push waits instead of cancelling a
    # run that may be halfway through posting its review.
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check that secrets are available
        id: guard
        env:
          CG_API_KEY: ${{ secrets.cg_api_key }}
          GH_PAT: ${{ secrets.gh_pat }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$CG_API_KEY" ] && [ -n "$GH_PAT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason=""
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            reason="this pull request comes from a fork (\`$HEAD_REPO\`) and GitHub does not pass repository secrets to fork pull requests"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            reason="Dependabot runs only receive Dependabot secrets; add CG_API_KEY and GH_PAT as Dependabot secrets to review its pull requests"
          fi
          if [ -n "$reason" ]; then
            echo "::warning title=AI review NOT performed::Secrets are unavailable: $reason."
            {
              echo "### ⚠️ AI review not performed"
              echo ""
              echo "The agent did not run because $reason."
              echo "A maintainer can review this pull request manually."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=Missing secrets::The cg_api_key and gh_pat secrets must both be passed to the reusable workflow (empty values received)."
          exit 1

      - name: Check out the AI Review Agent
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agent_repository }}
          ref: ${{ inputs.agent_ref }}
          persist-credentials: false

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install GitHub MCP Server (standalone binary)
        if: steps.guard.outputs.run == 'true'
        env:
          # Keep equal to DEFAULT_MCP_IMAGE in src/config.py (checked by a test).
          MCP_VERSION: v2.0.3
        run: |
          set -euo pipefail
          base="https://github.com/github/github-mcp-server/releases/download/${MCP_VERSION}"
          dir="$RUNNER_TEMP/github-mcp-server"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL -O "$base/github-mcp-server_Linux_x86_64.tar.gz"
          curl -fsSL -o checksums.txt "$base/github-mcp-server_${MCP_VERSION#v}_checksums.txt"
          grep " github-mcp-server_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf github-mcp-server_Linux_x86_64.tar.gz github-mcp-server
          echo "GITHUB_MCP_COMMAND=$dir/github-mcp-server" >> "$GITHUB_ENV"

      - name: Run AI Code Review
        if: steps.guard.outputs.run == 'true'
        env:
          CG_API_KEY: ${{ secrets.cg_api_key }}
          CG_MODEL: ${{ inputs.cg_model }}
          CG_BASE_URL: ${{ inputs.cg_base_url }}
          GITHUB_TOKEN: ${{ secrets.gh_pat }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REOPEN_RESOLVED_THREADS: ${{ inputs.reopen_resolved_threads }}
          AGENT_LOGINS: ${{ inputs.agent_logins }}
          LOG_LEVEL: ${{ inputs.log_level }}
        run: python main.py
